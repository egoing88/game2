name: ChatGPT Temp Whisper Model

on:
  push:
    branches:
      - chatgpt-temp-whisper-model
    paths:
      - .github/workflows/chatgpt-temp-whisper-model.yml

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download multilingual Whisper model
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl -L --fail --retry 5 --retry-delay 2 \
            -o bundle/ggml-small-q5_1.bin \
            https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-small-q5_1.bin
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  bundle/ggml-small-q5_1.bin" | sha256sum -c -
          ls -lh bundle/ggml-small-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5-model
          path: bundle/ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
